apiVersion: training.educates.dev/v1beta1
kind: Workshop
metadata:
  name: lab-agentgateway-sample
spec:
  title: Per-attendee LLM keys with agentgateway
  description: >-
    Each attendee gets their own rate-limited LLM API key, minted for the
    session and revoked when it ends. Shows what a workshop author writes and
    what the operator does with it.

  publish:
    image: $(image_repository)/lab-agentgateway-sample-files:$(workshop_version)

  workshop:
    files:
      - image:
          url: $(image_repository)/lab-agentgateway-sample-files:$(workshop_version)

  session:
    namespaces:
      budget: small

    # A tab onto agentgateway's own debugging UI, so attendees can watch the
    # requests they make on page 1 arrive at the gateway.
    #
    # Requires the platform to be installed with `adminInterface.exposed: true`.
    # Without it the gateway keeps the admin listener on loopback and the
    # data-plane Service publishes no port 15000 at all, so the tab renders a
    # connection error rather than a blank page. See docs/deployment.md.
    #
    # The ingress is what makes the UI reachable at all. A dashboard `url`
    # alone would be loaded by the attendee's browser, which cannot resolve a
    # ClusterIP; `ingresses` proxies it through the workshop dashboard instead,
    # from inside the cluster.
    ingresses:
      - name: agentgateway
        protocol: http
        # The shared gateway, in the platform's namespace rather than the
        # attendee's. This is the default from `bundledAgentgateway.namespace`;
        # a platform installed elsewhere needs this line changed to match.
        host: agentgateway-educates.agentgateway-system.svc.$(cluster_domain)
        port: 15000
        # No `path` here, deliberately. The UI is a single-page app built with
        # its base pinned to /ui/ and its API calls rooted at /api/, with no
        # runtime base path, so it only works when proxied at the root of its
        # own hostname. Scoping this ingress to a subpath serves the HTML and
        # then 404s every asset.

    # The tab itself. Custom tabs come after the built-in ones, so this lands
    # to the right of the terminal and editor.
    #
    # Named for the gateway rather than for the attendee: the UI shows one
    # shared, cluster-wide view of every session's traffic, not this
    # attendee's. That is deliberate for a demo, and page 1 says so.
    dashboards:
      - name: Gateway
        url: $(ingress_protocol)://agentgateway-$(session_name).$(ingress_domain)/ui/

    # The attendee's whole integration surface. Standard OpenAI-compatible
    # client libraries pick both of these up with no configuration, so workshop
    # content can use any SDK without knowing the gateway exists.
    env:
      - name: OPENAI_BASE_URL
        valueFrom:
          secretKeyRef:
            name: $(session_name)-agentgateway
            key: base-url
      - name: OPENAI_API_KEY
        valueFrom:
          secretKeyRef:
            name: $(session_name)-agentgateway
            key: api-key

    objects:
      # Attendees inspect their own grant and Secret on pages 2, 3, 4 and 5. The
      # default session role covers only the core, apps, batch and networking
      # groups, so reading a custom resource needs an explicit grant, without
      # this, every kubectl command in the content fails with a forbidden error.
      #
      # Both objects go in the workshop namespace because that is where the
      # session's service account lives and where the operator places the
      # Secret. The subject namespace below is $(workshop_namespace) for the
      # same reason; $(session_namespace) is the common mistake here.
      #
      # This Role requires the operator's chart to be installed with
      # `educates.extendSessionManagerPermissions` (the default). Kubernetes
      # forbids granting permissions the creator does not hold, and Educates'
      # session-manager creates this object, so without the ClusterRole that
      # chart aggregates into session-manager the whole WorkshopSession fails:
      #
      #   ...-agentgateway-reader is forbidden: user
      #   "system:serviceaccount:educates:session-manager" is attempting to
      #   grant RBAC permissions not currently held
      #
      # Drop this Role and the RoleBinding if the workshop content does not
      # need attendees to read their own grant.
      - apiVersion: rbac.authorization.k8s.io/v1
        kind: Role
        metadata:
          name: $(session_name)-agentgateway-reader
          namespace: $(workshop_namespace)
        rules:
          - apiGroups: ["agentgateway.operators.educates.dev"]
            resources: ["agentgatewaysessions"]
            verbs: ["get", "list", "watch"]
          - apiGroups: [""]
            resources: ["secrets"]
            resourceNames: ["$(session_name)-agentgateway"]
            verbs: ["get"]

      - apiVersion: rbac.authorization.k8s.io/v1
        kind: RoleBinding
        metadata:
          name: $(session_name)-agentgateway-reader
          namespace: $(workshop_namespace)
        roleRef:
          apiGroup: rbac.authorization.k8s.io
          kind: Role
          name: $(session_name)-agentgateway-reader
        subjects:
          - kind: ServiceAccount
            name: $(service_account)
            namespace: $(workshop_namespace)

      # Page 4 reads the catalog to show attendees the ceiling their budget was
      # resolved against. The catalog is cluster-scoped, so this needs a
      # ClusterRole rather than the namespaced Role above.
      #
      # Read-only, and the catalog holds no credential material by design: it
      # references provider Secrets by name and never contains a key, which is
      # what makes it safe to show an attendee at all.
      #
      # Drop this pair, and page 4's catalog commands, if you would rather not
      # let attendees see the cluster's model configuration.
      - apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRole
        metadata:
          name: $(session_name)-agentgateway-catalog-reader
        rules:
          - apiGroups: ["agentgateway.operators.educates.dev"]
            resources: ["agentgatewaycatalogs"]
            resourceNames: ["cluster"]
            verbs: ["get"]

      - apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRoleBinding
        metadata:
          name: $(session_name)-agentgateway-catalog-reader
        roleRef:
          apiGroup: rbac.authorization.k8s.io
          kind: ClusterRole
          name: $(session_name)-agentgateway-catalog-reader
        subjects:
          - kind: ServiceAccount
            name: $(service_account)
            namespace: $(workshop_namespace)

      - apiVersion: agentgateway.operators.educates.dev/v1alpha1
        kind: AgentGatewaySession
        metadata:
          name: $(session_name)
          # REQUIRED, and load-bearing. Without it the grant lands in the
          # session namespace, where the Secret it creates would be unreachable
          # by the attendee's pod: that pod runs in the workshop namespace and a
          # secretKeyRef can only resolve within its own namespace. The operator
          # rejects a grant placed here with PlacementValid=False rather than
          # failing silently.
          namespace: $(workshop_namespace)
        spec:
          catalogRef:
            name: cluster

          # No `tokenBudget` here, deliberately.
          #
          # Omitting it makes this grant inherit whatever the cluster operator
          # set as `budgets.defaultTokenBudget` on the catalog, which is the
          # point: the workshop follows the cluster rather than freezing a
          # number into a workshop definition that was written months ago and
          # is redeployed rarely.
          #
          # The sample catalog sets 20000, small enough that page 3 can exhaust
          # it inside a session. Set a number here instead to override it, and
          # the operator's `maxTokenBudget` still bounds whatever you ask for.

          # How long one budget lasts before it refills. A day outlasts any
          # workshop, so in practice an attendee gets one budget for the whole
          # session; it is stated explicitly here because it is the default and
          # worth an author knowing it exists.
          #
          # Not the same thing as `ttl` below: this is how long the budget
          # lasts, that is how long the key works at all.
          budgetWindow: day

          ttl: 2h

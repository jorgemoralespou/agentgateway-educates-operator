# The model catalog the kind e2e runs against.
#
# The teardown test never makes an upstream call: it asserts on cascading
# deletion, so the credential this references is a placeholder. The catalog
# only has to render its models and become ready, which needs a Secret to
# exist, not a working key.
apiVersion: agentgateway.operators.educates.dev/v1alpha1
kind: AgentGatewayCatalog
metadata:
  name: cluster
spec:
  models:
  - baseURL: http://ollama.educates.test:11434
    credentialRef:
      key: api-key
      name: agentgateway-provider-credentials
    model: llama3.2:latest
    name: fast
    provider: Ollama
  - baseURL: http://ollama.educates.test:11434
    credentialRef:
      key: api-key
      name: agentgateway-provider-credentials
    model: llama3.2:latest
    name: smart
    provider: Ollama
  rateLimit:
    failureMode: FailClosed

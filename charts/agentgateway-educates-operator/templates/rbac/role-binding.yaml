apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "agentgateway-educates-operator.fullname" . }}-manager
  labels:
    {{- include "agentgateway-educates-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  # Generated by controller-gen from the +kubebuilder:rbac markers on the
  # reconcilers, into templates/rbac/role.yaml.
  name: agentgateway-operator-manager
subjects:
  - kind: ServiceAccount
    name: {{ include "agentgateway-educates-operator.fullname" . }}
    namespace: {{ .Release.Namespace }}
---
# Leader election needs write access to a Lease in the operator's own namespace.
# Namespaced rather than cluster-wide, because that is all it needs.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "agentgateway-educates-operator.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentgateway-educates-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "agentgateway-educates-operator.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentgateway-educates-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "agentgateway-educates-operator.fullname" . }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ include "agentgateway-educates-operator.fullname" . }}
    namespace: {{ .Release.Namespace }}

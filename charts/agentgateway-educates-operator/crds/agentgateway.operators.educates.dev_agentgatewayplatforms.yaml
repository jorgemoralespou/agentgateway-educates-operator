                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              gatewayNamespace:
                description: GatewayNamespace is where the Gateway and its key registrations
                  live.
                type: string
              gatewayURL:
                description: |-
                  GatewayURL is where sessions reach the gateway, over in-cluster DNS. Every
                  other resource reads the address from here rather than reconstructing it.
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the .metadata.generation this status was computed
                  from.
                format: int64
                type: integer
              phase:
                description: Phase is an advisory summary. Conditions are authoritative.
                enum:
                - Pending
                - Installing
                - Ready
                - Failed
                - Uninstalling
                type: string
            type: object
        type: object
        x-kubernetes-validations:
        - message: AgentGatewayPlatform is a singleton and must be named 'cluster'

kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: agentgatewaysessions.agentgateway.operators.educates.dev
spec:
  group: agentgateway.operators.educates.dev
  names:
    kind: AgentGatewaySession
    listKind: AgentGatewaySessionList
    plural: agentgatewaysessions
    shortNames:
    - agwsession
    singular: agentgatewaysession
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.secretRef.name
      name: Secret
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          AgentGatewaySession is one attendee's access to the Gateway for the duration
          of one session.

          Named for what it confers rather than for the credential that implements it:
          the key is an implementation detail, and a grant outlives any particular key
          when the key is rotated.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              AgentGatewaySessionSpec declares one attendee's access to the Gateway.

              This is the resource a workshop author writes into session.objects. It must
              carry `namespace: $(workshop_namespace)`: placement is load-bearing and
              asymmetric (ADR-0002), and a grant in a session namespace is rejected rather
              than reconciled.
            properties:
              catalogRef:
                description: CatalogRef names the catalog this session's models come
                  from.
                properties:
                  name:
                    default: cluster
                    description: Name of the AgentGatewayCatalog. Cluster-scoped,
                      so no namespace.
                    maxLength: 253
                    minLength: 1
                    type: string
                type: object
              tokenBudget:
                default: 100000
                description: |-
                  TokenBudget is the ceiling on LLM tokens for this session's lifetime.

                  Measured in tokens rather than requests because cost tracks tokens: one
                  request with a large context can cost more than a hundred small ones.
                format: int64
                minimum: 1
                type: integer
              ttl:
                default: 4h
                description: |-
                  TTL is a backstop expiry on the participant key, independent of any
                  cleanup path.

                  Not optional in spirit: force-deleting a namespace strips finalizers and
                  orphans the registration outright, and this is the only protection in that
                  case (ADR-0002).
                pattern: ^([0-9]+(\.[0-9]+)?(s|m|h))+$
                type: string
            type: object
          status:
            description: |-
              AgentGatewaySessionStatus reports the session's wiring.

              Never carries the participant key or its hash, so it is safe to paste into a
              support conversation.
            properties:
              conditions:
                description: Conditions are authoritative.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              expiresAt:
                description: |-
                  ExpiresAt is when the participant key stops working regardless of whether
                  any cleanup ran.
                format: date-time
                type: string
              gatewayURL:
                description: GatewayURL is the base URL written into that Secret.
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the .metadata.generation this status was computed
                  from.
                format: int64
                type: integer
              phase:
                description: Phase is an advisory summary. Conditions are authoritative.
                enum:
                - Pending
                - Ready
                - Failed
                - Rejected
                - Terminating
                type: string
              secretRef:
                description: |-
                  SecretRef names the Secret holding this attendee's key, so the wiring can
                  be checked by hand.
                properties:
                  name:
                    description: Name of the Secret, in the workshop namespace.
                    type: string
                required:
                - name
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}

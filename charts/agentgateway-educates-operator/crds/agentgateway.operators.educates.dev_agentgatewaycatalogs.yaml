---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: agentgatewaycatalogs.agentgateway.operators.educates.dev
spec:
  group: agentgateway.operators.educates.dev
  names:
    kind: AgentGatewayCatalog
    listKind: AgentGatewayCatalogList
    plural: agentgatewaycatalogs
    shortNames:
    - agwcatalog
    singular: agentgatewaycatalog
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.availableModels
      name: Models
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          AgentGatewayCatalog declares the models the Gateway offers.

          Configures a Gateway; never installs one: that is AgentGatewayPlatform's job,
          and this resource waits for it to be ready.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: AgentGatewayCatalogSpec declares the models the Gateway offers.
            properties:
              models:
                description: |-
                  Models is the flat list of models workshops may use.

                  Deliberately no failover, weighted routing, or per-model overrides: all
                  are additive later, and none is needed to teach against an LLM.
                items:
                  description: |-
                    CatalogModel is one name an attendee may address, bound to a provider and an
                    upstream model.

                    The catalog name is deliberately not the upstream model's name, so the binding
                    can change without touching workshop content.
                  properties:
                    baseURL:
                      description: |-
                        BaseURL overrides the provider's address. Required by agentgateway for
                        the Ollama provider.
                      pattern: ^https?://
                      type: string
                    credentialRef:
                      description: CredentialRef names the Secret holding this provider's
                        real API key.
                      properties:
                        key:
                          default: api-key
                          description: Key within the Secret holding the credential.
                          minLength: 1
                          type: string
                        name:
                          description: Name of the Secret, in the gateway namespace.
                          maxLength: 253
                          minLength: 1
                          type: string
                      required:
                      - name
                      type: object
                    model:
                      description: |-
                        Model is the provider's own model name, `gpt-4o-mini`,
                        `claude-sonnet-4-0`. Never visible to attendees.
                      maxLength: 1024
                      minLength: 1
                      type: string
                    name:
                      description: |-
                        Name is what attendees address, `fast`, `smart`. Never the provider's own
                        model name.
                      maxLength: 253
                      minLength: 1
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    provider:
                      description: Provider is the LLM provider serving this model.
                      enum:
                      - Anthropic
                      - Azure
                      - Baseten
                      - Bedrock
                      - Cerebras
                      - Cohere
                      - Deepinfra
                      - Deepseek
                      - Fireworks
                      - Gemini
                      - Groq
                      - Huggingface
                      - Mistral
                      - Ollama
                      - OpenAI
                      - Openrouter
                      - TogetherAI
                      - VertexAI
                      - XAI
                      type: string
                  required:
                  - credentialRef
                  - model
                  - name
                  - provider
                  type: object
                maxItems: 64
                minItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              rateLimit:
                description: |-
                  RateLimit configures how token-budget enforcement behaves.

                  It lives on the catalog rather than the platform because it is a choice
                  about serving LLM traffic, which is what the catalog governs, and the
                  platform's job is installing the gateway rather than deciding how it
                  behaves under load.
                properties:
                  failureMode:
                    default: FailClosed
                    description: |-
                      FailureMode decides whether a rate-limit service outage stops LLM traffic
                      or removes enforcement. Always written explicitly into the rendered
                      policy: the agentgateway CRD declares no schema default, so an omitted
                      value leaves the field absent and only the data plane applies FailClosed.
                    enum:
                    - FailClosed
                    - FailOpen
                    type: string
                type: object
              requestTimeout:
                description: |-
                  RequestTimeout is how long the gateway waits for a complete response from
                  an upstream model.

                  Exists for slow models rather than as a tuning knob. A reasoning model
                  served locally by Ollama can take well over a minute for one reply, past
                  agentgateway's own default, and the attendee sees `upstream call failed:
                  connection closed before message completed`, which reads like a broken
                  gateway, not a slow model.

                  A Go duration string: "90s", "3m". Left unset, agentgateway's default
                  applies, which is right for every hosted provider.
                pattern: ^([0-9]+(\.[0-9]+)?(ms|s|m|h))+$
                type: string
            required:
            - models
            type: object
          status:
            description: AgentGatewayCatalogStatus reports what the catalog rendered.
            properties:
              availableModels:
                description: |-
                  AvailableModels lists the catalog names an author may reference, so they
                  can find out what exists without reading the spec of a resource they may
                  not have access to.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: atomic
              conditions:
                description: Conditions are authoritative.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              gatewayURL:
                description: GatewayURL is read from the platform's status, never
                  reconstructed.
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the .metadata.generation this status was computed
                  from.
                format: int64
                type: integer
              phase:
                description: Phase is an advisory summary. Conditions are authoritative.
                enum:
                - Pending
                - Rendering
                - Ready
                - Failed
                type: string
            type: object
        type: object
        x-kubernetes-validations:
        - message: AgentGatewayCatalog is a singleton and must be named 'cluster'
          rule: self.metadata.name == 'cluster'
    served: true
    storage: true
    subresources:
      status: {}
